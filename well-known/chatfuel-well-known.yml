summary: >-
  Chatfuel serves no /.well-known/ discovery document of its own. Every RFC 8615
  path was probed on seven hosts and every one is either a hard 404 or a
  single-page-app catch-all that answers 200 with the same HTML shell for any
  path. The one real 200 (a security.txt on docs.chatfuel.com) is Intercom's
  document, not Chatfuel's — that host is an Intercom-operated help-center
  domain and the file declares Canonical https://app.intercom.com/.well-known/security.txt
  with Contact security@intercom.com. It is therefore NOT recorded as a Chatfuel
  surface and NO WellKnown or SecurityTxt pointer is wired into apis.yml.
