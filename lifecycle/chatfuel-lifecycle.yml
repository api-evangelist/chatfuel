deprecation:
  policy_url: null
  sunset_header: false
  detail: >-
    No deprecation or Sunset/Deprecation (RFC 8594) policy is published, and the
    absence is not theoretical. Between 2026-07-18 and 2026-08-13 Chatfuel
    retired its entire developer documentation set without any notice, redirect
    or successor page — see documentation_withdrawal below. The old Dashboard API
    docs carried only a change-notice caveat ("designed primarily for internal
    use and is subject to change without prior notice"), which is not a
    deprecation policy. No Deprecation pointer is wired in apis.yml because no
    policy exists.
documentation_withdrawal:
  observed: '2026-08-13'
  previous_state: '2026-07-18'
  detail: >-
    docs.chatfuel.com — the Intercom-hosted help center that carried the
    Broadcasting API article, the Dashboard API reference and the JSON API
    plugin documentation — now returns HTTP 404 from Intercom on every path,
    including its own root. The replacement help center at help.chatfuel.com is
    a Notaku site whose full sitemap (172 URLs across English, Spanish and
    Portuguese) contains exactly one API article: "Create contacts in Chatfuel
    via API". No redirect was left from any old URL, and search engines still
    index the dead ones.
  affected:
  - {url: 'https://docs.chatfuel.com/en/articles/790461-broadcasting-api', status: 404, was: Broadcasting API reference}
  - {url: 'https://docs.chatfuel.com/api/dashboard-api', status: 404, was: Dashboard API reference}
  - {url: 'https://docs.chatfuel.com/en/collections/168839-api', status: 404, was: API documentation collection}
  - {url: 'https://docs.chatfuel.com/en/', status: 404, was: developer portal / help center root}
  endpoints_still_live:
