apis:
- name: Chatfuel Broadcasting API
  description: >-
    HTTP API for sending any block or flow from a bot to a user via a POST
    request, including targeting users by attribute. Rate limited to 25 requests
    per second per bot. Requests are authenticated with a chatfuel_token.
  humanURL: https://docs.chatfuel.com/en/articles/790461-broadcasting-api
  baseURL: https://api.chatfuel.com
  tags:
  - Broadcasting
  - Messaging
  properties:
  - type: Documentation
    url: https://docs.chatfuel.com/en/articles/790461-broadcasting-api
  - type: Authentication
    url: authentication/chatfuel-authentication.yml
  - type: RateLimits
    url: rate-limits/chatfuel-rate-limits.yml
- name: Chatfuel Dashboard API
  description: >-
    HTTP API to programmatically create and modify bots and pages — create bots,
    clone bot content, generate role-based invite links, and bind/unbind bots to
    Facebook pages. Authenticated with a Bearer Dashboard API token. Designed
    primarily for internal use and subject to change without notice.
  humanURL: https://docs.chatfuel.com/api/dashboard-api
  baseURL: https://dashboard.chatfuel.com/api
  tags:
  - Dashboard
  - Bot Management
  properties:
  - type: Documentation
    url: https://docs.chatfuel.com/api/dashboard-api
  - type: Authentication
    url: authentication/chatfuel-authentication.yml
