aid: chatfuel
name: Chatfuel
description: >-
  Chatfuel is a no-code AI-powered chatbot and business-automation platform for
  conversational commerce across Meta-owned messaging channels — WhatsApp,
  Instagram, Facebook Messenger, TikTok, and an embeddable website chat widget.
  An official Meta Business Partner, Chatfuel lets teams build automated flows
  and Fuely AI agents that qualify leads, answer customer questions, take
  bookings, run re-engagement campaigns, and hand off to live agents. Its
  developer surface is deliberately small and has been shrinking: the single
  documented HTTP operation is a Contacts API on panel.chatfuel.com that imports
  up to 1,000 WhatsApp numbers into an automation with a Bearer account token.
  The older Broadcasting API (api.chatfuel.com) and Dashboard API
  (dashboard.chatfuel.com/api) still respond, but Chatfuel retired their
  documentation along with the whole docs.chatfuel.com help center during 2026,
  leaving no reference, no deprecation notice and no redirect. A live GraphQL
  gateway runs at panel.chatfuel.com/graphql with introspection disabled, and a
  Swagger route on the API host is walled behind Google SSO. Chatfuel publishes
  no OpenAPI, no AsyncAPI, no first-party SDK and no MCP server.
