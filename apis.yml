aid: chatfuel
name: Chatfuel
description: >-
  Chatfuel is a no-code AI-powered chatbot and business-automation platform for
  conversational commerce across Meta-owned messaging channels — WhatsApp,
  Instagram, Facebook Messenger, TikTok, and an embeddable website chat widget.
  Trusted by 18,000+ businesses and an official Meta Business Partner, Chatfuel
  lets teams build automated flows and AI agents that qualify leads, answer
  customer questions, take bookings, run re-engagement campaigns, and hand off to
  live agents. For developers Chatfuel exposes an HTTP Broadcasting API
  (api.chatfuel.com) for sending blocks and flows to users, a Dashboard API
  (dashboard.chatfuel.com/api) for programmatically creating and managing bots
  and page bindings, and a JSON API plugin for calling external services from
  inside a bot flow.
