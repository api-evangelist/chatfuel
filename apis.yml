- name: Chatfuel Broadcasting API
  description: >-
    HTTP API for sending any block or flow from a bot to a user via a POST
    request, including targeting users by attribute. Historically rate limited to
    25 requests per second per bot and authenticated with a per-bot
    chatfuel_token query parameter. DOCUMENTATION WITHDRAWN — the reference at
    docs.chatfuel.com returned HTTP 404 on every path when re-probed 2026-08-13
    and no successor article exists on help.chatfuel.com. The route itself is
    still live (a GET against the send path returns 405 Method Not Allowed rather
    than the host's usual JSON 404), so the surface persists without a contract.
  humanURL: https://help.chatfuel.com/
  baseURL: https://api.chatfuel.com
  tags:
  - Broadcasting
  - Messaging
  properties:
  - type: Authentication
    url: authentication/chatfuel-authentication.yml
  - type: RateLimits
    url: rate-limits/chatfuel-rate-limits.yml
  - type: Lifecycle
    url: lifecycle/chatfuel-lifecycle.yml
- name: Chatfuel Dashboard API
  description: >-
    HTTP API to programmatically create and modify bots and pages — create bots,
    clone bot content, generate role-based invite links, and bind/unbind bots to
    Facebook pages. Authenticated with a Bearer Dashboard API token and described
    by its own docs as designed primarily for internal use and subject to change
    without notice. DOCUMENTATION WITHDRAWN — docs.chatfuel.com/api/dashboard-api
    returned HTTP 404 on 2026-08-13 with no replacement page.
  humanURL: https://help.chatfuel.com/
  baseURL: https://dashboard.chatfuel.com/api
  tags:
  - Dashboard
  - Bot Management
  properties:
  - type: Authentication
    url: authentication/chatfuel-authentication.yml
  - type: Lifecycle
    url: lifecycle/chatfuel-lifecycle.yml
