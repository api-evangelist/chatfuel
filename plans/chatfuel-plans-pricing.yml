billing_unit_definition: >-
  "One active contact = one unique person who interacted with you in the last 30
  days." Counts messages with the automation (Fuely AI), messages with a human
  team member, and outgoing broadcasts/templates. A contact only becomes new
  again after 30 days of no activity. Messages within a contact's 30-day window
  are unlimited.
summary: >-
  Chatfuel prices on active contacts, not on API calls or messages. The help
  center publishes a full per-tier price table for two AI plan families (Fuely
  Super on GPT-5 mini, Fuely Max on GPT-5) plus a 7-day free trial and a custom
  Enterprise tier. No plan gates API access separately and no API-specific
  quota, overage rate or per-call price is published.
discrepancy_note: >-
  The marketing pricing page and the help center do not agree. chatfuel.com/pricing
  markets two tiers — "Chatfuel Light" (free) and "AI PRO" at "$49 USD per month"
  with a -29% yearly option — while the help center's Plans article (the page the
  pricing page links to for limits) publishes the Fuely Super / Fuely Max tables
  below and makes no mention of Light or AI PRO. Both were fetched 2026-08-13 and
  both returned 200. The help-center table is treated as the operative one here
  because it is the page the product's Billing tab is documented against; the
  marketing tiers are recorded separately rather than reconciled.
