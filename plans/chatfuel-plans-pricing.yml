usage_limits:
  source: https://limits.chatfuel.com/
  detail: >-
    The dedicated limits page publishes a fair-use framing rather than numbers:
    "unlimited active contacts", "unlimited messages", static (non-AI) actions
    such as keyword replies, button flows and broadcasts are "unlimited
    regardless of volume", and AI processing carries an unstated "fair use
    allowance per billing period". No numeric AI cap, per-plan API quota or API
    rate limit is published on this page.
api_access:
  gated_by_plan: false
  detail: >-
    No plan tier is documented as gating API access. The API token is taken from
    Settings -> API inside the account; no plan-specific API quota, per-call
    price or rate tier is published. See rate-limits/chatfuel-rate-limits.yml.
