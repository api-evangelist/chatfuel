summary: >-
  Chatfuel publishes no first-party client SDK on any package registry. The
  libraries below are community-maintained wrappers over the (now
  undocumented) Broadcasting API and are marked official:false. Every one of
  them predates the current panel.chatfuel.com API by four years or more and
  none wraps it, so all are abandonment signals rather than usable clients — no
  SDKs pointer is wired in apis.yml because no first-party SDK exists. The
  company's only first-party public code is an examples repository, not a
  package (see first_party_code below).
packages:
- language: javascript
  registry: npm
  name: chatfuel-api
  url: https://www.npmjs.com/package/chatfuel-api
  install: npm install chatfuel-api
  official: false
  author: eric.mathison
  version: 2.1.0
  published: '2021-07-03'
  repository: https://github.com/eric-mathison/chatfuel-api
  description: >-
    A library to simplify sending messages and broadcasts to a Chatfuel bot over
    Facebook Messenger.
  note: >-
    Last published 2021-07-03, five years before this check. Wraps the legacy
    api.chatfuel.com Broadcasting API whose documentation Chatfuel has since
    withdrawn; it does not cover the current panel.chatfuel.com contacts API.
