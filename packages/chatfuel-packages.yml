first_party_code:
- name: chatfuel-json-api-examples
  org: chatfuel-lab
  url: https://github.com/chatfuel-lab/chatfuel-json-api-examples
  official: true
  kind: examples
  registry: null
  version: null
  published: null
  language: typescript
  license: MIT
  description: >-
    Official Chatfuel Lab repository of example serverless (Netlify) functions
    that a bot calls through the Chatfuel JSON API plugin — business-hours
    checks, Shopify customer lookup and discount creation, email and phone
    verification. Each function is invoked as POST
    https://{netlify-app}.netlify.app/api/functions/{function-name} and returns
    user attributes to the bot.
  note: >-
    Not distributed through any package registry, so there is no metadata
    endpoint to read a version or release date from — version and published are
    null by fact, not by omission. This is sample code, not a client library, so
