summary: >-
  Chatfuel ships one embeddable client-side surface: a website chat widget that
  businesses add to their own site to expose the same AI/flow automation used on
  WhatsApp, Instagram, Messenger and TikTok. It is a hosted, prebuilt front end
  installed via an account-specific snippet, distinct from the server-side APIs.
  There is no published component library, no web-component package and no
  loader library on any registry — the snippet is generated inside the product,
  so the distribution is unpinned and a consumer cannot tell which build they
  receive.
components:
- family: Website Chat Widget
  kind: embeddable-widget
  description: >-
    A configurable live-chat / AI-assistant widget added to any website. The
    docs cover installing it, its feature set, its settings, its display modes,
    and turning it on and off. Documented behaviours include conversation flows,
    AI answers (Fuely AI) and live-agent handoff.
  install:
    method: account-generated script snippet
    source_of_snippet: Settings -> Website inside the Chatfuel panel
    placement: >-
      "Add the code snippet from Settings to your site's HTML" — documented as
      going inside the <head> tag or immediately before </body>.
    cdn_url: null
    package: null
    version: null
    note: >-
      No CDN URL, package name or version is published; the embed code is
      produced per account inside the product and the help center does not
      reproduce it. Recorded as null by fact, not by omission.
