summary: >-
  Chatfuel ships no MCP server, hosted or local. No remote endpoint, no npm or
  PyPI package, and no mention of the Model Context Protocol anywhere on
  chatfuel.com or help.chatfuel.com. The tool below is a CANDIDATE derived from
  the single documented HTTP operation Chatfuel publishes — it is what an MCP
  server would expose if one existed, not something Chatfuel offers. No
  MCPServer pointer is wired into apis.yml, because that pointer asserts the
  provider ships a server and this probe shows they do not.
