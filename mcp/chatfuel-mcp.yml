tools:
- name: create_whatsapp_contacts
  description: >-
    Import up to 1,000 WhatsApp phone numbers into a Chatfuel automation and
    assign a shared set of contact properties to all of them.
  source_operation: null
  source_docs: https://help.chatfuel.com/create-contacts-in-chatfuel-via-api-23134b06ecf8800683b6efacab24b68d
  http:
    method: POST
    url: https://panel.chatfuel.com/api/contacts/{automation_id}/whatsapp/
    auth: Authorization Bearer (account API token from Settings -> API)
  input_schema_source: prose-docs
  input_schema_note: >-
    Derived from the documented payload shape, not from a machine-readable
    contract — Chatfuel publishes no OpenAPI, so no real inputSchema exists to
    inherit. Documented fields: phones (array of E.164 strings, max 1000) and
    contact_data.properties (flat string map applied to every contact in the
    request). automation_id is a path parameter the docs say to read out of the
    browser address bar; there is no published operation that lists automations,
    so an agent cannot resolve it programmatically.
  consequence: write
